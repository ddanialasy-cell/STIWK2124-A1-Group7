<div class = "container">
    @if (alertMessage()) {
        <div class = "d-flex align-items-center justify-content-center py-3 my-5">
            <div class = "alert text-center w-75 {{ alertClass()}}" role = "alert">
                {{alertMessage()}}
            </div>
    </div>
    }
    <div class = "d-flex align-items-center justify-content-center py-3 my-5">
        <form class = "d-flex w-75" (ngSubmit)="searchDeleteBook()">
            <input class = "form-control me-2 border border-dark" type = "number" id = "bookIDInput" name = "searchBookID" [(ngModel)] = "searchBookID" #search = "ngModel" required [placeholder] = "search.invalid ? 'Book ID is required' : 'Enter Book ID'" [class.is-invalid] = "search.invalid" aria-label = "Enter Book ID"/>
            <button class = "btn btn-outline-success" type = "submit">Search</button>
        </form>
    </div>
</div>

<div class = "container">
    <div class = "d-flex align-items-center justify-content-center py-3 my-5 ">
        <form class = "border rounded p-3 bg-body-secondary w-75 border border-dark"> 
            <h4 class = 'ps-3'><b>Edit Book (ID: {{retrievedBook.bookID || 'None'}})</b></h4>
            <div class = "mb-3 p-3">
                <label for = "delBookTitleInput" class  = "form-label text-black">Book Title</label>
                <input type = "text" class = "form-control border border-dark" id = "delBookTitleInput" [value] = "retrievedBook.bookTitle" disabled>
            </div>
            <div class = "mb-3 p-3">
                <label for = "delBookAuthorInput" class  = "form-label text-black">Book Author</label>
                <input type = "text" class = "form-control border border-dark" id = "delBookAuthorInput" [value] = "retrievedBook.bookAuthor" disabled>
            </div>
            <div class = "mb-3 p-3">
                <label for = "delBookDescriptionInput" class  = "form-label text-black">Book Description</label>
                <input type = "text" class = "form-control border border-dark" id = "delBookDescriptionInput" [value] = "retrievedBook.bookDescription" disabled>
            </div>
            <div class = "mb-3 p-3">
                <label for = "delBookCategoryInput" class  = "form-label text-black">Book Category</label>
                <input type = "text" class = "form-control border border-dark" id = "delBookCategoryInput" [value] = "retrievedBook.bookCategory" disabled>
            </div>
            <button type="submit" class="btn btn-danger border border-dark mx-3 text-black" [disabled] = "retrievedBook.bookID === 0" (click) = "removeBook()">Delete</button>
        </form>
    </div>
</div>
