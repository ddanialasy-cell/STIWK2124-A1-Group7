<div class="form-container">
  <h2>{{ book ? '✏️ Edit Book' : '➕ Add New Book' }}</h2>

  <div class="form-group">
    <label>Title</label>
    <input [(ngModel)]="formData.title" placeholder="Enter book title" />
  </div>

  <div class="form-group">
    <label>Author</label>
    <input [(ngModel)]="formData.author" placeholder="Enter author name" />
  </div>

  <div class="form-group">
    <label>Category</label>
    <input [(ngModel)]="formData.category" placeholder="e.g. Technology, Fiction..." />
  </div>

  <div class="form-group">
    <label>Description</label>
    <textarea [(ngModel)]="formData.description" placeholder="Short description..."></textarea>
  </div>

  <div class="form-buttons">
    <button class="btn-submit" (click)="submit()">{{ book ? 'Update' : 'Add Book' }}</button>
    <button class="btn-cancel" (click)="cancel()">Cancel</button>
  </div>
</div>
